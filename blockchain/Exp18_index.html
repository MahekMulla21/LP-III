<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>E-Voting dApp</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
<style>
 body{font-family:Arial;max-width:600px;margin:30px auto}
 button{padding:6px 12px;margin:4px}
 li{margin:6px 0}
</style>
</head>
<body>
<h2>E-Voting dApp</h2>
<button onclick="connect()">Connect MetaMask</button>
<p id="account">Not connected</p>

<h3>Candidates</h3>
<ul id="list"></ul>

<h3>Admin: add candidate</h3>
<input id="cname" placeholder="Candidate name"><button onclick="addCandidate()">Add</button>
<br><button onclick="winner()">Show winner</button> <button onclick="closeVoting()">Close voting (admin)</button>
<p id="msg"></p>

<script>
// 1. Deploy Exp18_Voting.sol in Remix (Injected Provider - MetaMask, Sepolia) and paste the address here
const CONTRACT_ADDRESS = "PASTE_DEPLOYED_CONTRACT_ADDRESS";
const ABI = [
 "function addCandidate(string _name)",
 "function vote(uint256 _candidateId)",
 "function closeVoting()",
 "function getCandidateCount() view returns (uint256)",
 "function candidates(uint256) view returns (uint256 id, string name, uint256 voteCount)",
 "function getWinner() view returns (string name, uint256 votes)"
];
let contract;

async function connect() {
  const provider = new ethers.providers.Web3Provider(window.ethereum);
  await provider.send("eth_requestAccounts", []);
  const signer = provider.getSigner();
  document.getElementById("account").innerText = "Connected: " + await signer.getAddress();
  contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, signer);
  loadCandidates();
}
async function loadCandidates() {
  const n = (await contract.getCandidateCount()).toNumber();
  const ul = document.getElementById("list"); ul.innerHTML = "";
  for (let i = 0; i < n; i++) {
    const c = await contract.candidates(i);
    ul.innerHTML += `<li>${c.name} - votes: ${c.voteCount} <button onclick="vote(${i})">Vote</button></li>`;
  }
}
async function run(p, text) {
  try { const tx = await p; await tx.wait(); document.getElementById("msg").innerText = text; loadCandidates(); }
  catch (e) { document.getElementById("msg").innerText = "Error: " + (e.reason || e.message); }
}
function vote(i) { run(contract.vote(i), "Vote cast successfully"); }
function addCandidate() { run(contract.addCandidate(document.getElementById("cname").value), "Candidate added"); }
function closeVoting() { run(contract.closeVoting(), "Voting closed"); }
async function winner() {
  const w = await contract.getWinner();
  document.getElementById("msg").innerText = "Winner: " + w.name + " with " + w.votes + " votes";
}
</script>
</body>
</html>
